{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil Empresa</title>
  <link rel="stylesheet" href="{% static 'portal/style4.css' %}">
</head>
<body>

  <header class="header">
    <div class="brand">Portal de Prácticas TI - Empresa</div>
    <ul class="nav">
      <li><a href="{% url 'portal_empresas' %}">Inicio</a></li>
      <li><a href="{% url 'publicar_anuncio' %}">Publicar Anuncio</a></li> 
      <li><a href="{% url 'ver_postulaciones_empresa' %}">Ver Postulaciones</a></li>
      <li><a href="{% url 'gestionar_publicaciones' %}">Gestionar publicaciones</a></li>
      <li><a href="{% url 'logout' %}">Cerrar sesión</a></li>
    </ul>
  </header>

  <section class="section">
    <div class="form-container">
      <h2>Perfil de Empresa</h2>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar cambios</button>
      </form>
    </div>
  </section>
  {% include 'portal/partials/_footer.html' %}
</body>
</html>
